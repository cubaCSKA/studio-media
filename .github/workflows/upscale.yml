name: upscale

# Апскейл мелких кропов (08.11.2026, тест на jimm 08–15.11): заявка up_req/<id>.json от
# shared/upscale_remote.py submit → кадры делятся на 4 машины (не больше: решение владельца) →
# merge склеивает, заливает в studio-media и пишет ответ в ветку upscale-results репозитория studio.
# Модель realesr-general-x4v3 (BSD-3) на процессоре, ~3,5 с на кадр. Логи публичные — секреты не печатать.
on:
  push:
    branches: [main]
    paths: ["up_req/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upscale
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      req: ${{ steps.p.outputs.req }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: cubaCSKA/studio, token: "${{ secrets.STUDIO_TOKEN }}", path: studio, sparse-checkout: shared }
      - id: p
        working-directory: studio
        env: { GH_MEDIA_TOKEN: "${{ github.token }}", GITHUB_TOKEN: "${{ secrets.STUDIO_TOKEN }}" }
        run: python3 shared/upscale_remote.py plan
      - if: steps.p.outputs.req != ''
        uses: actions/upload-artifact@v4
        with: { name: req, path: studio/request.json, retention-days: 1 }

  shard:
    needs: plan
    if: needs.plan.outputs.req != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 4
      matrix: { k: [0, 1, 2, 3] }
    steps:
      - uses: actions/checkout@v4
        with: { repository: cubaCSKA/studio, token: "${{ secrets.STUDIO_TOKEN }}", path: studio, sparse-checkout: shared }
      - uses: actions/download-artifact@v4
        with: { name: req, path: studio }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install --quiet onnxruntime numpy pillow imageio-ffmpeg
          sudo ln -sf "$(python3 -c 'import imageio_ffmpeg as f; print(f.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg && ffmpeg -version | head -1
      - working-directory: studio
        run: python3 shared/upscale_remote.py shard request.json ${{ matrix.k }} 4
      - uses: actions/upload-artifact@v4
        with: { name: "seg-${{ matrix.k }}", path: studio/seg, retention-days: 1, if-no-files-found: ignore }

  merge:
    needs: [plan, shard]
    if: needs.plan.outputs.req != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: cubaCSKA/studio, token: "${{ secrets.STUDIO_TOKEN }}", path: studio, sparse-checkout: "shared\ncontent_studio" }
      - uses: actions/download-artifact@v4
        with: { name: req, path: studio }
      - uses: actions/download-artifact@v4
        with: { pattern: "seg-*", path: studio/segs }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install --quiet imageio-ffmpeg
          sudo ln -sf "$(python3 -c 'import imageio_ffmpeg as f; print(f.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg && ffmpeg -version | head -1
      - working-directory: studio
        env: { GH_MEDIA_TOKEN: "${{ github.token }}", GITHUB_TOKEN: "${{ secrets.STUDIO_TOKEN }}", STUDIO_ROOT: "${{ github.workspace }}/studio" }
        run: python3 shared/upscale_remote.py merge request.json segs
