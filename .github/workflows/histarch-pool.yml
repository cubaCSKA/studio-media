name: histarch film pool

# ПЕРЕНЕСЕНО из cubaCSKA/studio 25.10.2026: у закрытого studio кончились 2000
# бесплатных минут Actions в месяц, у публичного studio-media минуты не считаются.
# Код и состояние остаются в закрытом studio: workflow клонирует его секретом
# STUDIO_TOKEN (запись в cubaCSKA/studio) и туда же пушит результат. Файлы
# кадров кладутся в этот репозиторий через github.token. Логи здесь публичные —
# секреты в них не печатать.

# Ночная пересборка предотбора плёнки для «Мир как мир» (решение владельца
# 04.10.2026). Прогон канала тратил полтора-два часа из трёх на перебор
# archive.org и выпускал половину нормы. Этот workflow заранее проверяет
# выпуски (mp4 от 480p, права, не использовано) и кладёт список в
# histarch/pool.json. Выбор сюжета остаётся за прогоном. Рутина канала
# стартует в 01:30 UTC, пул собирается за пару часов до неё. Сборка
# накопительная: за ночь проверяется до 250 новых выпусков (archive.org под
# нагрузкой отвечает по 10 с на запрос), проверенное повторно не трогается.

on:
  schedule:
    - cron: "40 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: histarch-pool
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cubaCSKA/studio
          token: ${{ secrets.STUDIO_TOKEN }}
          path: studio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pool
        run: python3 histarch/scripts/ha_pool.py build --max-checks 250
      - name: Commit pool
        run: |
          git config user.name "histarch-pool"
          git config user.email "actions@users.noreply.github.com"
          git add histarch/pool.json
          if git diff --cached --quiet; then
            echo "пул не изменился"
            exit 0
          fi
          git commit -m "histarch: ночной пул плёнки $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --quiet origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "не удалось запушить пул" >&2
          exit 1
